services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: taskflow, POSTGRES_USER: taskflow, POSTGRES_PASSWORD: taskflow }
    volumes: [taskflow-db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"], interval: 5s, timeout: 5s, retries: 20 }
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://taskflow:taskflow@db:5432/taskflow
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me}
      EMAIL_MODE: console
      DEMO_SEED: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-TaskFlowDemo2026!}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLIENT_ORIGIN: http://localhost:3000
    depends_on: { db: { condition: service_healthy } }
    volumes: [taskflow-uploads:/app/uploads]
  web:
    build: .
    ports: ["3000:80"]
    depends_on: [api]
volumes: { taskflow-db: {}, taskflow-uploads: {} }
