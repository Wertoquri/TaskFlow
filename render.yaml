services:
  - type: web
    name: taskflow-portfolio
    runtime: node
    plan: free
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_MODE
        value: console
      - key: DEMO_SEED
        value: "true"
      - key: DEMO_EMAIL
        value: demo@taskflow.local
      - key: DEMO_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
