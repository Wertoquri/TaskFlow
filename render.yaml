services:
  - type: web
    name: taskflow-portfolio
    runtime: node
    plan: free
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_MODE
        value: smtp
      - key: EMAIL_API_URL
        sync: false
      - key: EMAIL_API_SECRET
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_SECURE
        value: "false"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DEMO_SEED
        value: "true"
      - key: DEMO_EMAIL
        value: demo@taskflow.local
      - key: DEMO_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
